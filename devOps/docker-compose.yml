services:
  # Backend service
  backend:
    build: 
      context: ../apps/backend
      dockerfile: ../../devOps/backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/emotional_app
      - JWT_SECRET=changeme_in_production_please
      - PORT=3001
      - NODE_ENV=development
    volumes:
      - ../apps/backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - db
    networks:
      - emotional_network

  # Frontend service  
  frontend:
    build:
      context: ../apps/frontend
      dockerfile: ../../devOps/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
      - NODE_ENV=development
    volumes:
      - ../apps/frontend:/app
      - frontend_node_modules:/app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - emotional_network

  # Database service
  db:
    image: postgres:16-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=emotional_app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - emotional_network

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  emotional_network:
    driver: bridge